name: 'PkgDiet CI Gate'
description: |
  Enforce dependency safety policy in CI/CD pipelines.
  Blocks PRs with deprecated, unhealthy, or policy-violating dependencies.
  AI agents follow the same rules locally via MCP.

inputs:
  base:
    description: |
      The Git commit SHA or ref to compare against.
      Typically 'HEAD~1' for PRs or the main branch ref.
      Required for dependency diff analysis.
    required: true

  environment:
    description: |
      The policy environment to apply.
      Common values: 'ci', 'dev', 'prod', 'staging'.
      Defaults to 'ci' for strictest enforcement.
    required: false
    default: 'ci'

  fail-on:
    description: |
      Override the default failure threshold.
      Values: 'BLOCK' (default) or 'WARN'.
      Set to 'WARN' to fail PRs even on warnings.
    required: false
    default: 'BLOCK'

  dry-run:
    description: |
      Print results without failing the workflow.
      Useful for testing policy changes or gradual rollout.
      Values: 'true' or 'false'.
    required: false
    default: 'false'

  working-directory:
    description: |
      The subdirectory containing package.json and lockfiles.
      Use for monorepos or nested projects.
    required: false
    default: '.'

  version:
    description: |
      PkgDiet version to use (e.g., '2.0.0' or 'latest').
      Defaults to the latest stable release.
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Run PkgDiet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(ci --env "${{ inputs.environment }}" --base "${{ inputs.base }}")
        if [ "${{ inputs.fail-on }}" != "BLOCK" ]; then
          args+=(--fail-on "${{ inputs.fail-on }}")
        fi
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          args+=(--dry-run)
        fi
        npx -y "pkgdiet@${{ inputs.version }}" "${args[@]}"
