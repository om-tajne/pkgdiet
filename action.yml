name: 'PkgDiet'
description: 'Dependency safety gate — ALLOW/WARN/BLOCK verdict on every new npm package added in a PR. Works with Claude, Cursor, Copilot, and all MCP agents.'
author: 'om-tajne'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  base:
    description: 'Git ref to compare against'
    required: false
    default: 'HEAD~1'
  environment:
    description: 'Policy environment: ci | dev | prod'
    required: false
    default: 'ci'
  fail-on:
    description: 'Failure threshold: BLOCK or WARN'
    required: false
    default: 'BLOCK'
  dry-run:
    description: 'Print results without failing (true/false)'
    required: false
    default: 'false'
  working-directory:
    description: 'Subdirectory containing package.json'
    required: false
    default: '.'
  version:
    description: 'PkgDiet version to use'
    required: false
    default: '2.0.1'
  node-version:
    description: 'Node.js version'
    required: false
    default: '20'

outputs:
  verdict:
    description: 'Overall verdict: PASS or FAIL'
    value: ${{ steps.pkgdiet.outputs.verdict }}
  summary:
    description: 'Human-readable results summary'
    value: ${{ steps.pkgdiet.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run PkgDiet
      id: pkgdiet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PKGDIET_CI: 'true'
      run: |
        set +e
        ARGS=(ci --env "${{ inputs.environment }}" --base "${{ inputs.base }}")
        [ "${{ inputs.fail-on }}" = "WARN" ] && ARGS+=(--fail-on WARN)
        [ "${{ inputs.dry-run }}" = "true" ] && ARGS+=(--dry-run)
        npx -y "pkgdiet@${{ inputs.version }}" "${ARGS[@]}"
        CODE=$?
        [ $CODE -eq 0 ] && echo "verdict=PASS" >> $GITHUB_OUTPUT || echo "verdict=FAIL" >> $GITHUB_OUTPUT
        [ $CODE -eq 0 ] && echo "summary=All dependency checks passed." >> $GITHUB_OUTPUT || echo "summary=One or more dependencies failed the policy check." >> $GITHUB_OUTPUT
        exit $CODE
