name: PkgDiet Organization Gate

# This is a reusable workflow template for Enterprise adoption.
# It enforces a central dependency policy across the organization.
# 
# Organization Requirements:
# 1. This workflow produces outputs and fails the check. It does NOT post PR comments natively.
# 2. Branch protection must be configured separately in your repository settings to require this job.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pkgdiet:
    name: Enforce Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Use a pinned SHA for strict supply-chain controls instead of a mutable v4 tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 is strictly required to allow lockfile diffing against the base branch
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Run PkgDiet CI Gate
        # Recommended default for strict supply-chain controls: pin to a full commit SHA
        # uses: om-tajne/pkgdiet@<FULL_40_CHARACTER_COMMIT_SHA> # v2.0.0
        # Convenience option for automatic minor patches:
        uses: om-tajne/pkgdiet@v2
        with:
          base: 'HEAD~1'
          environment: 'ci'
          fail-on: 'BLOCK'
          version: '2.0.0'
