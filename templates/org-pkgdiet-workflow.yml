name: PkgDiet Organization Enforcement

# This is a reusable workflow template for Enterprise adoption.
# It can be called from individual repository workflows to enforce
# a central dependency policy across the organization.

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      fail-on:
        required: false
        type: string
        default: 'BLOCK'
        description: 'Failure threshold: BLOCK or WARN'

jobs:
  dependency-policy:
    name: Enforce Dependency Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is strictly required to allow lockfile diffing against the base branch
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run PkgDiet CI Gate
        id: pkgdiet
        uses: om-tajne/pkgdiet@v2
        with:
          # Base branch defaults to the PR target or HEAD~1
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          environment: 'ci'
          fail-on: ${{ inputs.fail-on }}
          version: '2.0.0'

      # Optional: Post PR comment on failure
      - name: Post PR Comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **PkgDiet CI Gate Failed**\nOne or more dependencies added in this PR violate the organization security policy. Please review the workflow logs.'
            })
