name: pkgdiet
description: >
  PkgDiet is a local Node.js MCP server for dependency-policy checks in npm projects.
  It exposes read-only tools for evaluating package names against a local project policy,
  checking multiple packages with bounded concurrency, finding curated alternatives, and
  reading the effective policy. It runs over stdio and does not install packages or modify
  files. Registry checks may send the requested package name to public npm metadata and
  download-statistics endpoints. MCP results are advisory; CI remains the enforcement backstop.
version: 2.0.0
author: om-tajne
license: MIT
homepage: https://github.com/om-tajne/pkgdiet
categories:
  - developer-tools
  - security
  - npm
tags:
  - npm
  - dependencies
  - security
  - supply-chain
  - ai-agent
  - mcp-server
  - policy
  - alternatives

startCommand:
  type: stdio
  config:
    command: npx
    args:
      - "-y"
      - "pkgdiet@2.0.0"
      - "mcp"

runtimeRequirements:
  node: ">=20"

privacy:
  dataLeavingMachine:
    - "Package names are sent to registry.npmjs.org and api.npmjs.org for metadata and download statistics."
  dataSentExternal: true
  dataStoredExternal: false
  requiresAccount: false

tools:
  - name: check_dependency
    description: >
      Evaluate one npm package against the active local dependency policy. This is a
      read-only operation. It may query public npm metadata when network checks are
      enabled. The result is advisory; call this before recommending or installing a
      package. Returns verdict (ALLOW/WARN/BLOCK), healthScore, reasons, costEstimate,
      alternatives, certified, and hasProvenance. certified indicates whether the
      package satisfied the configured certification conditions — it is not a universal
      safety guarantee. hasProvenance reports whether the npm metadata included a
      provenance signal — it is not a complete supply-chain attestation.

  - name: check_dependencies
    description: >
      Evaluate multiple npm package names with bounded concurrency (max 50 per call,
      10 concurrent). Invalid names are reported as validationWarnings while valid
      names continue to be evaluated. This is a read-only operation that may query
      public npm metadata. Returns per-package results and an aggregate summary.

  - name: suggest_alternative
    description: >
      Return curated replacement candidates for a package. Candidates are advisory
      recommendations, not installation instructions. Call check_dependency for the
      selected candidate before recommending or installing it.

  - name: get_policy
    description: >
      Return the effective local dependency policy and its validation results for the
      current workspace. This operation does not modify policy files. Useful for
      understanding why a particular verdict was issued.

quickstart:
  oneCommand: "npx -y pkgdiet@2.0.0 setup"
  description: >
    Preview and confirm project setup. Creates .pkgdietrc.json and optional
    integration files after explicit user confirmation. Does not silently modify
    global AI configuration.
