version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pkgdiet
      POSTGRES_PASSWORD: pkgdiet_password
      POSTGRES_DB: pkgdiet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkgdiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  github-app:
    build:
      context: .
      dockerfile: apps/github-app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pkgdiet:pkgdiet_password@postgres:5432/pkgdiet
      - GITHUB_APP_ID=\
      - GITHUB_WEBHOOK_SECRET=\
      - GITHUB_PRIVATE_KEY=\
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://pkgdiet:pkgdiet_password@postgres:5432/pkgdiet
      - NEXT_PUBLIC_GITHUB_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
