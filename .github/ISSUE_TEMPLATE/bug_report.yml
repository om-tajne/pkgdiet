name: Bug Report
description: File a bug report to help us improve PkgDiet
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Run 'npx pkgdiet ...'
        2. See error
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: What version of Node.js are you using? (Run `node -v`)
      placeholder: e.g. v20.10.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: Windows, macOS, or Linux?
      placeholder: e.g. macOS Sonoma
    validations:
      required: true
