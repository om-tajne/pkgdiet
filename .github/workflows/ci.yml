name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Remove tsc problem matcher
      run: echo "::remove-matcher owner=tsc::"
    - run: npm install
    - run: npx tsc -b packages/core packages/mcp packages/cli
    - run: node packages/cli/dist/cli.js --help
