name: PkgDiet Dependency Gate

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pkgdiet:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run PkgDiet
        id: pkgdiet
        uses: om-tajne/pkgdiet@v2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          environment: ci
          fail-on: BLOCK

      - name: Post PR comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const verdict = '${{ steps.pkgdiet.outputs.verdict }}';
            const icon = verdict === 'PASS' ? '\u2705' : '\uD83D\uDEAB';
            const body = `## ${icon} PkgDiet Dependency Check\n\n**Verdict:** ${verdict}\n\n> Powered by [PkgDiet](https://github.com/om-tajne/pkgdiet)`;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch(e) { console.log('Could not post comment:', e.message); }
